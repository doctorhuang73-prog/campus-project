name: iOS initial build
on:
  push:
    branches: [main, 'feature/**', 'fix/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # This project is public. Standard GitHub-hosted macOS runners have no compute charge.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test protocol and data isolation rules
        run: swift test
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Compile simulator application
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project Campus.xcodeproj -scheme Campus -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build/simulator.log
      - name: Launch real iOS simulator and capture screens
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE" build/simulator/Build/Products/Debug-iphonesimulator/Campus.app
          mkdir -p build/screenshots
          for TAB in 0 1 2 3; do
            xcrun simctl launch --terminate-running-process "$DEVICE" io.github.doctorhuang73.campus --preview-tab "$TAB"
            sleep 3
            xcrun simctl io "$DEVICE" screenshot "build/screenshots/tab-$TAB.png"
          done
          xcrun simctl shutdown "$DEVICE"
      - name: Compile unsigned iPhone application
        run: |
          set -o pipefail
          xcodebuild -project Campus.xcodeproj -scheme Campus -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee build/device.log
      - name: Package IPA for personal re-signing on Windows
        run: |
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/Campus.app build/package/Payload/
          cd build/package
          zip -q -r ../Campus-unsigned.ipa Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Campus-unsigned-IPA
          path: build/Campus-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-screenshots
          path: build/screenshots
          retention-days: 7
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/*.log
          retention-days: 3
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Campus-unsigned-IPA
          path: release-files
      - name: Preserve versioned IPA in GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-files/Campus-unsigned.ipa --verify-tag --title "校园助手 iOS $GITHUB_REF_NAME" --notes-file docs/RELEASE.md
